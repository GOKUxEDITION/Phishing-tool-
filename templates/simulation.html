<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Awareness Simulation</title><style>body{font-family:system-ui;background:#f2f5fa;color:#20283a;padding:24px}.box{max-width:650px;margin:10vh auto;background:white;border-radius:16px;padding:24px;box-shadow:0 8px 30px #0001}button{padding:12px;border:0;border-radius:10px;background:#345eea;color:white;margin:5px;cursor:pointer}.notice{background:#fff4d6;padding:12px;border-radius:10px}</style></head><body><div class="box"><h1>Safe Awareness Scenario</h1><div class="notice">Training page: this is a simulation, not a real service. Never enter passwords, OTPs or other secrets on a link received unexpectedly.</div><p>A message asks you to urgently review an account. What would you do?</p><button onclick="send('simulation_continue_click')">Inspect link clues</button><button onclick="send('simulation_report_click')">Report suspicious message</button><p id="out"></p><a href="/">Back to dashboard</a></div><script>async function send(e){await fetch('/api/event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event:e})});document.getElementById('out').textContent=e==='simulation_report_click'?'Good choice: report it through the service’s official channel.':'Check the sender, domain, URL destination and urgency cues. Avoid clicking; open the service directly.'}fetch('/api/event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event:'simulation_open'})});</script></body></html>
